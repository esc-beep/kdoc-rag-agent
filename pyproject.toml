[project]
name = "kobridge-harness"
version = "0.1.0"
description = "Korean document wiki agent and RAG context builder for agent-ready context."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "markdown-it-py>=4.0.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "rank-bm25>=0.2.2",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
korean = ["kiwipiepy>=0.21.0"]
dev = ["pytest>=8.3.0"]

[project.scripts]
kobridge = "kobridge_harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kobridge_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
